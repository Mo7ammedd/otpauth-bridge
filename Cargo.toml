[package]
name = "otpauth-bridge"
version = "0.1.0"
edition = "2024"
description = "Offline TOTP migration between authenticator apps"
license = "MIT"
repository = "https://github.com/Mo7ammedd/otpauth-bridge"
readme = "README.md"
keywords = ["totp", "authenticator", "migration", "otpauth", "2fa"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
percent-encoding = "2.3"
prost = "0.14"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rpassword = "7.4"
rqrr = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }
zeroize = "1.8"

[dev-dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
